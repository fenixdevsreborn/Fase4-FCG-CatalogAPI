services:
  postgres:
    image: postgres:16-alpine
    container_name: catalogapi-postgres
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d catalogdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catalogapi-network

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: catalogapi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - catalogapi-network

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: catalogapi-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Admin123!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - catalogapi-network

  catalogapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogapi
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDatabase: "Host=postgres;Port=5432;Database=catalogdb;Username=admin;Password=admin123"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      Jwt__Key: super-secret-dev-key-change-in-production-32chars
      Jwt__Issuer: UsersAPI
      Jwt__Audience: UsersAPI
      OpenSearch__Enabled: "true"
      OpenSearch__Endpoint: http://opensearch:9200
      OpenSearch__IndexName: fcg-games-dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - catalogapi-network

  adminer:
    image: adminer
    container_name: catalogapi-adminer
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - catalogapi-network

volumes:
  postgres_data:
  rabbitmq_data:
  opensearch_data:


networks:
  catalogapi-network:
    driver: bridge
